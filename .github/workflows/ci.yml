name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jimamuto/vivadeo-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Extract web metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jimamuto/vivadeo-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Log in to Azure
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          az extension add --name containerapp --upgrade --yes
          az containerapp update --resource-group rg-vivadeo --name vivadeo-api --image "ghcr.io/jimamuto/vivadeo-api:${tag}" --output none
          az containerapp update --resource-group rg-vivadeo --name vivadeo-worker --image "ghcr.io/jimamuto/vivadeo-api:${tag}" --output none
          az containerapp update --resource-group rg-vivadeo --name vivadeo-web --image "ghcr.io/jimamuto/vivadeo-web:${tag}" --output none

          for app in vivadeo-api vivadeo-worker; do
            test "$(az containerapp show --resource-group rg-vivadeo --name "$app" --query properties.template.containers[0].image --output tsv)" = "ghcr.io/jimamuto/vivadeo-api:${tag}"
          done
          test "$(az containerapp show --resource-group rg-vivadeo --name vivadeo-web --query properties.template.containers[0].image --output tsv)" = "ghcr.io/jimamuto/vivadeo-web:${tag}"

          web_url="https://$(az containerapp show --resource-group rg-vivadeo --name vivadeo-web --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 "$web_url" > /dev/null
