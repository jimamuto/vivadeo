services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vivadeo
      POSTGRES_USER: vivadeo
      POSTGRES_PASSWORD: vivadeo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivadeo -d vivadeo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${VIVADEO_API_IMAGE:-ghcr.io/jimamuto/vivadeo-api:latest}
    command: sh -c "alembic upgrade head && uvicorn vivadeo.api:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vivadeo:vivadeo@postgres:5432/vivadeo
      REDIS_URL: redis://redis:6379/0
      VIVADEO_INTERNAL_SERVICE_KEY: ${VIVADEO_INTERNAL_SERVICE_KEY:-change-me}
      VIVADEO_DEFAULT_ORG_ID: ${VIVADEO_DEFAULT_ORG_ID:-default-workspace}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.eu-central-003.backblazeb2.com}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:3000/api/proxy/v1/media}
      S3_BUCKET: ${S3_BUCKET:-vivadeo}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_REGION: ${S3_REGION:-eu-central-003}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
    volumes:
      - type: bind
        source: ./vivadeo
        target: /app/vivadeo
      - type: bind
        source: ./alembic
        target: /app/alembic
      - type: bind
        source: ./alembic.ini
        target: /app/alembic.ini
        read_only: true
      - type: bind
        source: ./media
        target: /media
        read_only: true
      - type: bind
        source: ${VIVADEO_MODAL_CONFIG_PATH:-./.modal.toml}
        target: /root/.modal.toml
        read_only: true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: ${VIVADEO_API_IMAGE:-ghcr.io/jimamuto/vivadeo-api:latest}
    command: celery -A vivadeo.worker.celery_app worker --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vivadeo:vivadeo@postgres:5432/vivadeo
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.eu-central-003.backblazeb2.com}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:3000/api/proxy/v1/media}
      S3_BUCKET: ${S3_BUCKET:-vivadeo}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_REGION: ${S3_REGION:-eu-central-003}
    volumes:
      - type: bind
        source: ./vivadeo
        target: /app/vivadeo
      - type: bind
        source: ./alembic
        target: /app/alembic
      - type: bind
        source: ./alembic.ini
        target: /app/alembic.ini
        read_only: true
      - type: bind
        source: ./media
        target: /media
        read_only: true
      - type: bind
        source: ${VIVADEO_MODAL_CONFIG_PATH:-./.modal.toml}
        target: /root/.modal.toml
        read_only: true
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${VIVADEO_WEB_IMAGE:-ghcr.io/jimamuto/vivadeo-web:latest}
    command: npm run dev
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgres://vivadeo:vivadeo@postgres:5432/vivadeo}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-vivadeo-better-auth-secret-change-before-production}
      VIVADEO_INTERNAL_SERVICE_KEY: ${VIVADEO_INTERNAL_SERVICE_KEY:-change-me}
      VIVADEO_DEFAULT_ORG_ID: ${VIVADEO_DEFAULT_ORG_ID:-default-workspace}
      EMAIL_FROM: ${EMAIL_FROM:-DoNotReply@your-azure-managed-domain.azurecomm.net}
      AZURE_COMMUNICATION_CONNECTION_STRING: ${AZURE_COMMUNICATION_CONNECTION_STRING:-}
      NODE_ENV: development
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    volumes:
      - type: bind
        source: ./web
        target: /app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  web_node_modules:
  web_next:
