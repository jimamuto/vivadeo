services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${VIVADEO_API_IMAGE:-ghcr.io/jimamuto/vivadeo-api:latest}
    command: sh -c "alembic upgrade head && uvicorn vivadeo.api:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      VIVADEO_INTERNAL_SERVICE_KEY: ${VIVADEO_INTERNAL_SERVICE_KEY:-change-me}
      VIVADEO_DEFAULT_ORG_ID: ${VIVADEO_DEFAULT_ORG_ID:-default-workspace}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-azure}
      STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:3000/api/proxy/v1/media}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-vivadeo}
      AZURE_STORAGE_TIMEOUT: ${AZURE_STORAGE_TIMEOUT:-300}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.eu-central-003.backblazeb2.com}
      S3_BUCKET: ${S3_BUCKET:-vivadeo}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-eu-central-003}
    volumes:
      - type: bind
        source: ./media
        target: /media
        read_only: true
      - type: bind
        source: ${VIVADEO_MODAL_CONFIG_PATH:-./.modal.toml}
        target: /root/.modal.toml
        read_only: true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: ${VIVADEO_API_IMAGE:-ghcr.io/jimamuto/vivadeo-api:latest}
    command: sh -c "celery -A vivadeo.worker.celery_app worker --loglevel=INFO --concurrency $${VIVADEO_WORKER_CONCURRENCY:-4} --max-tasks-per-child=100"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-azure}
      STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:3000/api/proxy/v1/media}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-vivadeo}
      AZURE_STORAGE_TIMEOUT: ${AZURE_STORAGE_TIMEOUT:-300}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_WHISPER_DEPLOYMENT: ${AZURE_OPENAI_WHISPER_DEPLOYMENT:-}
      AZURE_OPENAI_WHISPER_TIMEOUT: ${AZURE_OPENAI_WHISPER_TIMEOUT:-900}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.eu-central-003.backblazeb2.com}
      S3_BUCKET: ${S3_BUCKET:-vivadeo}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-eu-central-003}
    volumes:
      - type: bind
        source: ./media
        target: /media
        read_only: true
      - type: bind
        source: ${VIVADEO_MODAL_CONFIG_PATH:-./.modal.toml}
        target: /root/.modal.toml
        read_only: true
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${VIVADEO_WEB_IMAGE:-ghcr.io/jimamuto/vivadeo-web:latest}
    environment:
      API_INTERNAL_URL: http://api:8000
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?AUTH_DATABASE_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-vivadeo-better-auth-secret-change-before-production}
      VIVADEO_INTERNAL_SERVICE_KEY: ${VIVADEO_INTERNAL_SERVICE_KEY:-change-me}
      VIVADEO_DEFAULT_ORG_ID: ${VIVADEO_DEFAULT_ORG_ID:-default-workspace}
      EMAIL_FROM: ${EMAIL_FROM:-DoNotReply@your-azure-managed-domain.azurecomm.net}
      AZURE_COMMUNICATION_CONNECTION_STRING: ${AZURE_COMMUNICATION_CONNECTION_STRING:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
